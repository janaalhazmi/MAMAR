# Runs the backend tests on every push and pull request: unit tests first, then integration
# tests against a real PostgreSQL database. The results show on the PR as a green or red check.
name: Backend tests

on:
  push:
    branches: [develop, main]
    paths: ["Stage 4 MVP Development and Execution/backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["Stage 4 MVP Development and Execution/backend/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mamar
          POSTGRES_PASSWORD: mamar_test
          POSTGRES_DB: mamar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mamar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mamar:mamar_test@localhost:5432/mamar_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      FRONTEND_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: "Stage 4 MVP Development and Execution/backend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "Stage 4 MVP Development and Execution/backend/requirements.txt"
      - run: pip install -r requirements.txt pytest-cov
      - name: Unit tests
        run: python -m pytest -m unit -v --junitxml=reports/pytest-unit.xml
      - name: Integration tests
        run: python -m pytest -m integration -v --cov=app --cov-report=term --junitxml=reports/pytest-integration.xml
      - name: Save the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "Stage 4 MVP Development and Execution/backend/reports/"
