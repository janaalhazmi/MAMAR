<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAMAR | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <!-- Header -->
  <header class="login-header">

    <a href="index.html" class="login-header-brand">
      <img
        src="assets/mamar-logo.svg"
        alt="MAMAR Logo"
        class="login-header-logo"
      >
    </a>

    <div class="login-header-buttons">

      <a href="login.html" class="login-nav-btn signin-btn">
        Sign in
        <span>→</span>
      </a>

      <a href="signup.html" class="login-nav-btn start-btn">
        Get Started
      </a>

    </div>

  </header>


  <!-- Main -->
  <main class="login-main">

    <section class="login-card">

      <!-- Logo -->
      <img
        src="assets/mamar-logo.svg"
        alt="MAMAR"
        class="login-logo"
      >


      <!-- Title -->
      <h1>Welcome back</h1>


      <!-- User Type -->
      <div class="role-buttons">

        <button
          type="button"
          class="role-btn"
          data-role="contractor"
        >
          Contractor
        </button>

        <button
          type="button"
          class="role-btn"
          data-role="provider"
        >
          Provider
        </button>

        <button
          type="button"
          class="role-btn"
          data-role="field-worker"
        >
          Field Worker
        </button>

      </div>


      <!-- Login Form -->
      <form class="login-form" id="loginForm">

        <!-- Selected role -->
        <input
          type="hidden"
          id="selectedRole"
          name="role"
          value=""
        >


        <!-- Email -->
        <div class="login-field">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <!-- Password -->
        <div class="login-field">

          <div class="password-heading">

            <label for="password">
              Password
            </label>

            <a href="#" class="forgot-password">
              Forgot?
            </a>

          </div>


          <div class="password-input">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="eye-btn"
              id="togglePassword"
              aria-label="Show password"
            >
              ◉
            </button>

          </div>

        </div>


        <!-- Login Button -->
        <button
          type="submit"
          class="login-submit"
        >
          Login now
        </button>

      </form>


      <!-- Divider -->
      <div class="login-or">
        Or
      </div>


      <!-- Create Account -->
      <a
        href="signup.html"
        class="create-account"
      >
        Create account
      </a>

    </section>

  </main>


  <script>

    /* -------------------------
       Role Selection
    ------------------------- */

    const roleButtons =
      document.querySelectorAll(".role-btn");

    const selectedRole =
      document.getElementById("selectedRole");


    roleButtons.forEach(button => {

      button.addEventListener("click", () => {

        roleButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedRole.value =
          button.dataset.role;

      });

    });


    /* -------------------------
       Password Show / Hide
    ------------------------- */

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");


    togglePassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";

        togglePassword.setAttribute(
          "aria-label",
          "Hide password"
        );

      } else {

        passwordInput.type = "password";

        togglePassword.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    });


    /* -------------------------
       Form Validation
    ------------------------- */

    const loginForm =
      document.getElementById("loginForm");


    loginForm.addEventListener("submit", event => {

      if (!selectedRole.value) {

        event.preventDefault();

        alert(
          "Please select your account type."
        );

        return;

      }

      /*
        Backend integration will be
        added here later.
      */

    });

  </script>

</body>
</html>
