<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAMAR | Create Account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

  <header class="signup-header">

    <a href="index.html">
      <img
        src="assets/mamar-logo.svg"
        alt="MAMAR Logo"
        class="signup-header-logo"
      >
    </a>

    <div class="signup-header-buttons">

      <a href="login.html" class="signup-nav-btn signup-signin">
        Sign in
        <span>→</span>
      </a>

      <a href="signup.html" class="signup-nav-btn signup-start">
        Get Started
      </a>

    </div>

  </header>


  <main class="signup-main">

    <section class="signup-card">

      <h1>Create Account</h1>

      <p class="signup-subtitle">
        Get started with MAMAR
      </p>


      <!-- Role Selection -->
      <div class="signup-role-buttons">

        <button
          type="button"
          class="signup-role-btn"
          data-role="contractor"
        >
          Contractor
        </button>

        <button
          type="button"
          class="signup-role-btn"
          data-role="provider"
        >
          Provider
        </button>

        <button
          type="button"
          class="signup-role-btn"
          data-role="field-worker"
        >
          Field Worker
        </button>

      </div>


      <!-- Field Worker Message -->
      <p
        id="fieldWorkerMessage"
        class="field-worker-message"
        style="display: none;"
      >
        Enter the email address sent to you by your service provider.
      </p>


      <form class="signup-form" id="signupForm">

        <input
          type="hidden"
          id="signupRole"
          name="role"
          value=""
        >


        <!-- Email -->
        <div class="signup-field">

          <label for="signupEmail">
            Email
          </label>

          <input
            type="email"
            id="signupEmail"
            name="email"
            placeholder="you@gmail.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- Password -->
        <div class="signup-field">

          <label for="signupPassword">
            Password
          </label>

          <div class="signup-password-wrapper">

            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Create your password"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="signup-eye-btn"
              id="signupTogglePassword"
              aria-label="Show password"
            >
              ◉
            </button>

          </div>

        </div>


        <!-- Create Account Button -->
        <button
          type="submit"
          class="signup-submit"
        >
          Create Account →
        </button>

      </form>


      <p class="signup-existing">
        Already have an account?
      </p>

      <a href="login.html" class="signup-login-link">
        Sign in
      </a>

    </section>

  </main>


  <script>

    /* Role Selection */

    const signupRoleButtons =
      document.querySelectorAll(".signup-role-btn");

    const signupRole =
      document.getElementById("signupRole");

    const fieldWorkerMessage =
      document.getElementById("fieldWorkerMessage");


    signupRoleButtons.forEach(button => {

      button.addEventListener("click", () => {

        signupRoleButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        button.classList.add("active");

        signupRole.value = button.dataset.role;


        if (button.dataset.role === "field-worker") {

          fieldWorkerMessage.style.display = "block";

        } else {

          fieldWorkerMessage.style.display = "none";

        }

      });

    });


    /* Show / Hide Password */

    const signupPassword =
      document.getElementById("signupPassword");

    const signupTogglePassword =
      document.getElementById("signupTogglePassword");


    signupTogglePassword.addEventListener("click", () => {

      if (signupPassword.type === "password") {

        signupPassword.type = "text";

        signupTogglePassword.setAttribute(
          "aria-label",
          "Hide password"
        );

      } else {

        signupPassword.type = "password";

        signupTogglePassword.setAttribute(
          "aria-label",
          "Show password"
        );

      }

    });


    /* Form Validation */

    const signupForm =
      document.getElementById("signupForm");


    signupForm.addEventListener("submit", event => {

      if (!signupRole.value) {

        event.preventDefault();

        alert("Please select your account type.");

        return;

      }

    });

  </script>

</body>
</html>
